<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Draw with Dayan</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff4fa; --ink:#4a2c5e; --pink:#ff6fae; --purple:#9b6dff; --old:#cdbfdb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  body { margin:0; min-height:100vh; background:var(--bg) radial-gradient(#ffd6ea 2px, transparent 2px) 0 0/28px 28px;
         font-family:'Baloo 2', 'Chalkboard SE', system-ui, sans-serif; color:var(--ink); }
  [hidden] { display:none !important; }

  /* Home: pick a girl */
  #home { padding:24px; max-width:1300px; margin:0 auto; }
  #home h1 { margin:0; text-align:center; font-size:clamp(34px,4.6vw,56px); color:var(--pink); line-height:1.1; }
  #home .sub { margin:4px 0 20px; text-align:center; font-size:clamp(22px,2.6vw,30px); }
  .group { margin:26px 4px 12px; font-size:clamp(28px,3.4vw,38px); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:18px; }
  .pick { font:inherit; color:inherit; background:#fff; border:none; border-radius:28px; padding:10px 10px 12px; box-shadow:0 7px 0 #f2c4dc; text-align:center; }
  .pick:active { transform:translateY(5px); box-shadow:0 2px 0 #f2c4dc; }
  .pick svg { width:100%; aspect-ratio:300/360; display:block; }
  .pick b { display:block; font-size:28px; line-height:1.1; }
  .pick span { font-size:19px; color:var(--purple); }

  /* Lesson */
  #lesson { display:flex; gap:22px; padding:10px 14px; height:100vh; height:100dvh; align-items:center; }
  .board { position:relative; height:calc(100vh - 20px); height:calc(100dvh - 20px); aspect-ratio:300/360; max-width:68vw; flex:none;
           background:#fff; border-radius:32px; box-shadow:0 8px 0 #f2c4dc; overflow:hidden; }
  .board svg { position:absolute; inset:0; width:100%; height:100%; }
  .side { flex:1; display:flex; flex-direction:column; gap:16px; min-width:0; height:100%; }
  .top { display:flex; align-items:center; gap:14px; }
  .top h2 { margin:0; font-size:clamp(30px,3.6vw,44px); color:var(--pink); line-height:1; flex:1; }
  .home { font:inherit; font-size:30px; border:none; background:#fff; border-radius:20px; width:64px; height:64px; box-shadow:0 5px 0 #ecd7e6; flex:none; }
  .dots { display:flex; gap:9px; flex-wrap:wrap; }
  .dot { width:24px; height:24px; border-radius:50%; background:#f3d9e9; border:none; padding:0; }
  .dot.done { background:var(--purple); } .dot.now { background:var(--pink); transform:scale(1.3); }
  .card { background:#fff; border-radius:32px; padding:22px 26px; box-shadow:0 8px 0 #e3d4ff; flex:1; display:flex; flex-direction:column; justify-content:center; }
  .num { margin:0; font-size:clamp(24px,2.6vw,30px); color:var(--purple); font-weight:800; }
  .title { margin:0; font-size:clamp(40px,5vw,62px); line-height:1.05; font-weight:800; }
  .tip { margin:12px 0 0; font-size:clamp(26px,3vw,36px); line-height:1.25; }
  .notebook { margin:16px 0 0; font-size:clamp(22px,2.4vw,28px); background:#fff8d6; border-radius:20px; padding:10px 16px; }
  .row { display:flex; gap:14px; }
  button.big { flex:1; font:inherit; font-weight:800; font-size:clamp(20px,2.3vw,26px); border:none; border-radius:20px; padding:8px; color:#fff;
               min-height:62px; box-shadow:0 7px 0 rgba(0,0,0,.15); }
  button.big:active { transform:translateY(5px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  button.big:disabled { opacity:.3; }
  #back { background:var(--purple); flex:.7; } #next { background:var(--pink); } #replay { background:#38c6b0; flex:none; }

  .new { stroke:var(--pink); } .old { stroke:var(--old); }
  .guide { stroke-dasharray:6 6; }
  .fade { animation:fade 1s ease forwards; opacity:0; }
  .old .fade, .done .fade { animation:none; opacity:1; }
  @keyframes fade { to { opacity:1; } }
  .party { position:fixed; inset:0; pointer-events:none; font-size:50px; }
  .party span { position:absolute; top:-60px; animation:fall 2.8s linear forwards; }
  @keyframes fall { to { transform:translateY(115vh) rotate(360deg); } }
  /* Big picture mode: slim side panel, the drawing gets the whole screen. */
  #lesson.big .side { flex:none; width:230px; }
  #lesson.big .top h2, #lesson.big .dots, #lesson.big .notebook, #lesson.big .lbl { display:none; }
  #lesson.big .card { padding:14px 16px; }
  #lesson.big .num { font-size:18px; } #lesson.big .title { font-size:30px; } #lesson.big .tip { font-size:19px; margin-top:6px; }
  #lesson.big .top { justify-content:space-between; }
  #lesson.big { gap:12px; }
  #lesson.big .board { max-width:calc(100vw - 270px); }
  .home.sq { font-size:26px; } .home.on { background:#ffe2f0; box-shadow:0 5px 0 #f2a6cb; }
  #lesson.big .row button { font-size:21px; padding:8px 2px; white-space:nowrap; }
  @media (orientation:portrait) {
    #lesson.big { padding:8px; }
    #lesson.big .board { width:100%; height:auto; max-width:min(100%, calc((100dvh - 230px) * .8333)); }
    #lesson.big .side { width:100%; flex-direction:row; flex-wrap:wrap; height:auto; gap:8px; }
    #lesson.big .top { order:3; flex:none; }
    #lesson.big .card { order:1; flex:1 1 100%; padding:8px 14px; }
    #lesson.big .row { order:2; flex:1; }
    #lesson.big #replay { order:2; flex:none; width:70px; }
    #lesson.big .title { font-size:26px; } #lesson.big .tip { font-size:17px; }
    #lesson { flex-direction:column; height:auto; min-height:100vh; }
    .board { height:auto; width:100%; max-width:min(100%, calc((100dvh - 300px) * .8333)); margin:0 auto; }
    .side { width:100%; height:auto; }
  }
</style>
</head>
<body>
<section id="home">
  <h1>🎨 Hi Dayan! 🌸</h1>
  <p class="sub">What do you want to draw today?</p>
  <div id="grid"></div>
</section>

<section id="lesson" hidden>
  <div class="board"><svg id="demo" viewBox="0 0 300 360" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></svg></div>
  <div class="side">
    <div class="top">
      <button class="home" id="homeBtn" aria-label="All pictures">🏠</button>
      <h2 id="who"></h2>
      <button class="home sq" id="bigBtn" aria-label="Big picture" title="Big picture">🔎</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="card">
      <p class="num" id="num"></p>
      <p class="title" id="title"></p>
      <p class="tip" id="tip"></p>
      <p class="notebook">📒 Now draw it in your notebook! ✏️</p>
    </div>
    <button class="big" id="replay">🔁<span class="lbl"> Show me again</span></button>
    <div class="row">
      <button class="big" id="back">⬅️ Back</button>
      <button class="big" id="next">Next ➡️</button>
    </div>
  </div>
</section>

<script src="girls.js"></script>
<script src="things.js"></script>
<script src="solid.js"></script>
<script src="advanced.js"></script>
</body>
</html>
